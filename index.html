<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3d2438">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="./magic.js"></script><title>Fox Spirits — ожившая карточка</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#fff;background:#211626;font:16px system-ui,sans-serif}
#intro{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:18px;background:linear-gradient(150deg,#6d3349,#32263f)}
#intro h1{font-size:clamp(22px,6vw,30px);margin:0}#intro p{line-height:1.5;max-width:380px;margin:0;color:#ffedf4}
#intro img{height:min(42vh,300px);max-width:min(78vw,240px);object-fit:contain;box-shadow:0 10px 30px #0006;border-radius:7px}
button,.link{background:#ffe5ee;border:0;border-radius:32px;color:#742c47;font:700 16px system-ui;padding:13px 22px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}
#status{position:fixed;z-index:10;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#321b34da;border-radius:40px;padding:11px 18px;min-width:260px;max-width:90vw;text-align:center;font-size:13px}
#tools{position:fixed;z-index:10;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:9px}
#tools button{font-size:14px;padding:10px 17px}
#error{max-width:400px;white-space:pre-wrap;color:#ffd9da;font-size:13px}
.small{font-size:12px;color:#ffe5ee}
</style></head><body>
<div id="intro"><h1>🦊 Маленькое волшебство для тебя ♡</h1><img src="./card.png" alt="Подарочная карточка"><p>Нажми «Оживить», разреши доступ к камере и наведи её на лицевую сторону нашей карточки.</p><button type="button" id="start">✨ Оживить карточку</button><div class="small">Лучше всего работает при хорошем освещении</div><div id="error" role="alert"></div><a class="link" href="./preview.html">Посмотреть 3D без камеры</a></div>
<div id="status">Наведи камеру на карточку · ✨ хвосты и сакура</div>
<div id="tools"><button type="button" id="smaller" aria-label="Уменьшить">− размер</button><button type="button" id="bigger" aria-label="Увеличить">+ размер</button></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack:1" embedded renderer="colorManagement:true;antialias:true;physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
<a-assets timeout="90000"><a-asset-item id="girl" src="./models/girl.glb"></a-asset-item><a-asset-item id="white" src="./models/white_fox.glb"></a-asset-item><a-asset-item id="black" src="./models/black_fox.glb"></a-asset-item></a-assets>
<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity light="type:ambient;intensity:1.7;color:#ffffff"></a-entity>
<a-entity light="type:directional;intensity:2.1;color:#fff6eb" position="-1 2 2"></a-entity>
<a-entity light="type:directional;intensity:.5;color:#d4cfff" position="1 1 -2"></a-entity>
<a-entity id="target" mindar-image-target="targetIndex:0">
  <!-- Карточка стоит вертикально перед камерой: фигуры параллельны рисунку и вынесены немного вперёд. -->
  <a-entity id="scale-root" position="0 -.54 .12">
    <a-entity animation__breathe="property:position;from:0 0 0;to:0 .015 0;dur:2400;loop:true;dir:alternate;easing:easeInOutSine" animation__lean="property:rotation;from:0 -1.0 0;to:0 1.0 0;dur:4200;loop:true;dir:alternate;easing:easeInOutSine">
      <a-gltf-model src="#girl" scale=".93 .93 .93" position="0 0 0"></a-gltf-model>
    </a-entity>
    <a-entity position="-.31 0 .07" rotation="0 12 0" animation__float="property:position;from:-.31 0 .07;to:-.31 .025 .07;dur:1800;loop:true;dir:alternate;easing:easeInOutSine">
      <a-gltf-model src="#white" scale=".46 .46 .46" fox-tail-wave="speed:1.0;phase:0"></a-gltf-model>
    </a-entity>
    <a-entity position=".31 0 .07" rotation="0 -12 0" animation__float="property:position;from:.31 .02 .07;to:.31 0 .07;dur:2050;loop:true;dir:alternate;easing:easeInOutSine">
      <a-gltf-model src="#black" scale=".46 .46 .46" fox-tail-wave="speed:1.14;phase:1.7"></a-gltf-model>
    </a-entity>
    <a-entity sakura-petals="count:12;spread:1.0;speed:1.0"></a-entity>
    <a-sphere position="-.45 .72 .11" radius=".018" color="#ffbdcc" material="opacity:.85;transparent:true" animation="property:position;from:-.45 .72 .11;to:-.29 .92 .11;dur:3200;dir:alternate;loop:true"></a-sphere>
    <a-sphere position=".42 .65 .13" radius=".015" color="#fff0a6" material="opacity:.85;transparent:true" animation="property:position;from:.42 .65 .13;to:.35 .88 .13;dur:2500;dir:alternate;loop:true"></a-sphere>
  </a-entity>
</a-entity></a-scene>
<script src="./ar.js"></script>
</body></html>
