<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a71928">
  <title>Fox Spirits — AR-карточка</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script defer src="./app.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #1c1619; font-family: system-ui, sans-serif; }
    #hud { position: fixed; top: 0; left: 0; right: 0; z-index: 10000; padding: max(18px, env(safe-area-inset-top)) 16px 14px; pointer-events: none; display:flex; align-items:center; flex-direction:column; gap:8px; }
    .pill { max-width: 95vw; text-align:center; color:#fff; background:rgba(25,15,22,.78); padding: 10px 16px; border: 1px solid rgba(255,255,255,.28); border-radius: 100px; font-size: 14px; backdrop-filter:blur(9px); }
    #start-screen { position: fixed; z-index: 11000; inset: 0; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; color: #fff; background: linear-gradient(145deg, #3e1724, #1c1427); }
    #start-screen img { display:block; width:min(55vw, 240px); max-height:39vh; object-fit:contain; border-radius: 10px; box-shadow:0 12px 34px #0008; }
    h1 {font-size:clamp(23px, 6vw, 36px); margin:0;}
    p { margin: 0; max-width: 370px; line-height: 1.5; color:#f8e5e8; }
    button {border:0; border-radius: 30px; color: #fff; background: #d52343; font-weight: 700; font-size: 16px; padding:15px 27px; cursor:pointer; }
    button:disabled { opacity: .6; }
    #error { color:#ffbfbf; font-size: 13px; white-space:pre-wrap; max-width: 430px; }
    #help { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom)); left: 50%; transform:translateX(-50%); z-index: 10000; pointer-events:none; width: 92%; text-align:center; color:#fff; font-size:13px; text-shadow: 0 1px 5px #000; }
  </style>
</head>
<body>
  <div id="start-screen">
    <h1>🦊 Fox Spirits AR</h1>
    <img src="./card.png" alt="Карточка с девушкой и белым и чёрным девятихвостыми лисятами">
    <p>Разреши доступ к камере и наведи телефон на распечатанную карточку. Над ней появится 3D-сцена.</p>
    <button type="button" id="start">Открыть AR-камеру</button>
    <div id="error" role="alert"></div>
  </div>

  <div id="hud"><div id="status" class="pill" aria-live="polite">Наведите камеру на карточку</div></div>
  <div id="help">Для лучшего результата избегайте бликов на глянцевой бумаге.</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Local +Y stands out from the physical card because this group tilts 90 degrees around X. -->
      <a-entity id="living-scene" position="0 -0.15 0.04" rotation="90 0 0" cast-builder
        animation="property: position; from: 0 -0.15 0.01; to: 0 -0.15 0.045; dur: 1900; dir: alternate; loop: true; easing: easeInOutSine">
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
