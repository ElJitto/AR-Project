<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3d2438">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script src="./magic_v18.js?v=18"></script><title>Fox Spirits — ожившая карточка v18</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{color:#fff;background:#211626;font:16px system-ui,sans-serif}
a-scene{position:fixed!important;inset:0!important;display:block!important;width:100vw!important;height:100vh!important;height:100dvh!important;overflow:hidden!important}
#intro{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:18px;background:linear-gradient(150deg,#6d3349,#32263f)}
#intro h1{font-size:clamp(22px,6vw,30px);margin:0}#intro p{line-height:1.5;max-width:380px;margin:0;color:#ffedf4}
#intro img{height:min(42vh,300px);max-width:min(78vw,240px);object-fit:contain;box-shadow:0 10px 30px #0006;border-radius:7px}
button,.link{background:#ffe5ee;border:0;border-radius:32px;color:#742c47;font:700 16px system-ui;padding:13px 22px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}
#status{position:fixed;z-index:10;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#321b34da;border-radius:40px;padding:11px 18px;min-width:260px;max-width:90vw;text-align:center;font-size:13px}
#tools{position:fixed;z-index:10;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:9px}
#tools button{font-size:13px;padding:9px 12px} #tools{flex-wrap:wrap;gap:7px;padding:0 8px}
#error{max-width:400px;white-space:pre-wrap;color:#ffd9da;font-size:13px}
.small{font-size:12px;color:#ffe5ee}
</style>
<script>
AFRAME.registerComponent('fit-gltf', {
  schema: { height: {type: 'number', default: 1} },
  init() {
    this.el.addEventListener('model-loaded', () => {
      const THREE = AFRAME.THREE;
      const root = this.el.getObject3D('mesh');
      if (!root) return;
      root.updateMatrixWorld(true);
      const localBox = new THREE.Box3();
      const inverse = new THREE.Matrix4().copy(root.matrixWorld).invert();
      root.traverse(o => {
        if (!o.isMesh || !o.geometry) return;
        if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
        const relative = new THREE.Matrix4().multiplyMatrices(inverse, o.matrixWorld);
        localBox.union(o.geometry.boundingBox.clone().applyMatrix4(relative));
      });
      if (localBox.isEmpty()) return;
      const originalHeight = localBox.max.y - localBox.min.y;
      if (!Number.isFinite(originalHeight) || originalHeight <= 0) return;
      const factor = this.data.height / originalHeight;
      root.scale.multiplyScalar(factor);
      root.position.set(
        -(localBox.min.x + localBox.max.x) * 0.5 * factor,
        -localBox.min.y * factor,
        -(localBox.min.z + localBox.max.z) * 0.5 * factor
      );
      const name = this.el.getAttribute('data-gltf-label') || this.el.id || '3D';
      console.log('[Fox AR] loaded', name, 'height', originalHeight, 'scale', factor);
    });
  }
});
</script>
</head><body>
<div id="intro"><h1>🦊 Маленькое волшебство для тебя ♡</h1><img src="./card.png" alt="Подарочная карточка"><p>Нажми «Оживить», разреши доступ к камере и наведи её на лицевую сторону нашей карточки.</p><button type="button" id="start">✨ Оживить карточку</button><div class="small">Лучше всего работает при хорошем освещении</div><div id="error" role="alert"></div><a class="link" href="./preview_v18.html">Посмотреть 3D без камеры</a></div>
<div id="status">Наведи камеру на карточку · ✨ хвосты и сакура</div>
<div id="tools"><button type="button" id="greet" aria-label="Позвать лисят">♡ Обнять</button><button type="button" id="smaller" aria-label="Уменьшить">− размер</button><button type="button" id="bigger" aria-label="Увеличить">+ размер</button></div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack:1; uiScanning: no" embedded renderer="colorManagement:true;antialias:true;physicallyCorrectLights:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
<a-entity light="type:ambient;intensity:1.7;color:#ffffff"></a-entity>
<a-entity light="type:directional;intensity:2.1;color:#fff6eb" position="-1 2 2"></a-entity>
<a-entity light="type:directional;intensity:.5;color:#d4cfff" position="1 1 -2"></a-entity>
<a-entity id="target" mindar-image-target="targetIndex:0">
  <!-- Карточка стоит вертикально перед камерой: фигуры параллельны рисунку и вынесены немного вперёд. -->
  <a-entity id="scale-root" position="0 -.54 .12" spirit-show="mode:ar" magic-hearts="centerY:.78;size:.08">
    <a-entity data-actor="girl">
      <a-gltf-model src="./girl_hug_v18.glb?v=18" scale="1.05 1.05 1.05" data-gltf-label="Девушка" morph-clip-player position="0 0 0"></a-gltf-model>
    </a-entity>
    <a-entity data-actor="white">
      <a-gltf-model src="./white_fox_animated.glb?v=16" scale=".40 .40 .40" data-gltf-label="Белый лисёнок" morph-clip-player></a-gltf-model>
    </a-entity>
    <a-entity data-actor="black">
      <a-gltf-model src="./black_fox_animated.glb?v=16" scale=".40 .40 .40" data-gltf-label="Чёрный лисёнок" morph-clip-player></a-gltf-model>
    </a-entity>
    <a-entity sakura-petals="count:12;spread:1.0;speed:1.0"></a-entity>
    <a-sphere position="-.45 .72 .11" radius=".018" color="#ffbdcc" material="opacity:.85;transparent:true" animation="property:position;from:-.45 .72 .11;to:-.29 .92 .11;dur:3200;dir:alternate;loop:true"></a-sphere>
    <a-sphere position=".42 .65 .13" radius=".015" color="#fff0a6" material="opacity:.85;transparent:true" animation="property:position;from:.42 .65 .13;to:.35 .88 .13;dur:2500;dir:alternate;loop:true"></a-sphere>
  </a-entity>
</a-entity></a-scene>
<script src="./ar.js"></script>
<script>
  document.querySelector("#greet").addEventListener("click",()=>document.querySelector("#scale-root").emit("fox-greet"));
  document.querySelector("#target").addEventListener("targetFound",()=>document.querySelector("#scale-root").emit("fox-greet"));
</script>
<script>
(()=>{
 const names=[...document.querySelectorAll('[data-gltf-label]')];const results=new Map();
 const status=document.getElementById('status');
 for(const el of names){const name=el.getAttribute('data-gltf-label');
  el.addEventListener('model-loaded',()=>{results.set(name,'ok');if(results.size===names.length&&![...results.values()].includes('error'))status.textContent='Все три 3D-модели загружены ✨'});
  el.addEventListener('model-error',e=>{results.set(name,'error');status.textContent='Ошибка загрузки: '+name;console.error('GLB load error',name,e.detail)});
 }
})();
</script>
</body></html>
